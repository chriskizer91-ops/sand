<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7fd6e6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sandcastle Cays</title>
<style>
:root {
  --ink: #3b3a36;
  --ink-soft: #6f6a5e;
  --paper: rgba(255, 252, 245, 0.92);
  --paper-solid: #fffcf5;
  --sand: #e9d3a6;
  --sand-deep: #c9a66b;
  --sea: #2fb5b0;
  --sea-deep: #157e93;
  --coral: #f07a55;
  --shadow: 0 6px 18px rgba(40, 60, 70, 0.18);
  --radius: 18px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe8f5; color: var(--ink);
  font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--sea); outline-offset: 2px; }

/* ---------- heads-up display ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
#topbar { position: absolute; top: calc(10px + var(--safe-t)); left: 10px; right: 10px; display: flex; gap: 8px; align-items: flex-start; pointer-events: none; }
#topbar > * { pointer-events: auto; }
.spacer { flex: 1; pointer-events: none !important; }
.round { width: 48px; height: 48px; border-radius: 50%; background: var(--paper); box-shadow: var(--shadow); display: grid; place-items: center; transition: transform .12s ease, opacity .2s; }
.round:active { transform: scale(0.92); }
.round[disabled] { opacity: .45; }
#hand { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; border-radius: 26px; background: var(--paper); box-shadow: var(--shadow); min-height: 48px; max-width: 58vw; }
#hand .meter { width: 70px; height: 12px; border-radius: 6px; background: rgba(120, 100, 70, .18); overflow: hidden; flex: none; }
#hand .fill { height: 100%; width: 0%; border-radius: 6px; background: var(--sand); transition: width .15s, background .3s; }
#hand .label { font-size: 13px; line-height: 1.15; color: var(--ink-soft); }
#hand .label b { color: var(--ink); font-weight: 700; }
#toolbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(12px + var(--safe-b)); display: flex; gap: 8px; padding: 8px; border-radius: 28px; background: var(--paper); box-shadow: var(--shadow); }
.tool { width: 70px; height: 64px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 12px; font-weight: 700; color: var(--ink-soft); transition: background .15s, color .15s, transform .1s; }
.tool:active { transform: scale(0.94); }
.tool.on { background: var(--sea); color: #fff; box-shadow: inset 0 -3px 0 rgba(0,0,0,.12); }
.tool.size { width: 56px; border-left: 1px solid rgba(0,0,0,.06); border-radius: 0 20px 20px 0; }
#toast { position: absolute; left: 50%; top: calc(72px + var(--safe-t)); transform: translateX(-50%) translateY(-8px); background: rgba(40, 52, 58, .86); color: #fff; padding: 9px 16px; border-radius: 22px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; max-width: 86vw; text-align: center; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#hint { position: absolute; left: 50%; bottom: calc(100px + var(--safe-b)); transform: translateX(-50%); background: var(--paper); box-shadow: var(--shadow); border-radius: 16px; padding: 10px 14px; font-size: 14px; line-height: 1.35; max-width: min(92vw, 440px); text-align: center; transition: opacity .4s; }
#hint.hide { opacity: 0; pointer-events: none; }

/* ---------- screens and panels ---------- */
.screen { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; z-index: 20; }
#start { background: linear-gradient(180deg, rgba(120, 205, 235, .55), rgba(255, 238, 205, .75)); transition: opacity .5s; }
#start.gone { opacity: 0; pointer-events: none; }
.card { background: var(--paper-solid); border-radius: 26px; box-shadow: 0 14px 40px rgba(30, 60, 80, .25); padding: 26px 24px 22px; max-width: 420px; width: 100%; text-align: center; }
.card h1 { margin: 0 0 2px; font-size: 32px; letter-spacing: .5px; color: var(--sea-deep); }
.card .sub { margin: 0 0 16px; color: var(--ink-soft); font-size: 15px; }
.card p { font-size: 15px; line-height: 1.45; margin: 8px 0; }
.big { display: inline-block; margin-top: 14px; padding: 14px 34px; border-radius: 30px; background: var(--sea); color: #fff; font-size: 18px; font-weight: 800; box-shadow: 0 6px 0 var(--sea-deep), var(--shadow); transition: transform .1s; }
.big:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--sea-deep); }
.big[disabled] { opacity: .6; }
.progress { height: 10px; border-radius: 6px; background: rgba(0,0,0,.08); overflow: hidden; margin-top: 16px; }
.progress div { height: 100%; width: 0%; background: var(--sand-deep); transition: width .2s; }
.small { font-size: 12px; color: var(--ink-soft); margin-top: 12px; }
.panel { position: fixed; z-index: 30; right: 10px; top: calc(66px + var(--safe-t)); width: min(360px, calc(100vw - 20px)); max-height: calc(100% - 90px - var(--safe-t) - var(--safe-b)); overflow: auto; background: var(--paper-solid); border-radius: 22px; box-shadow: 0 12px 34px rgba(30, 60, 80, .28); padding: 16px; transform-origin: top right; transition: transform .18s, opacity .18s; }
.panel.hidden { opacity: 0; transform: scale(.94); pointer-events: none; }
.panel h2 { margin: 2px 0 10px; font-size: 19px; color: var(--sea-deep); display: flex; align-items: center; justify-content: space-between; }
.panel h3 { margin: 14px 0 6px; font-size: 14px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .6px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { padding: 9px 13px; border-radius: 16px; background: rgba(47, 181, 176, .12); font-weight: 700; font-size: 14px; color: var(--sea-deep); }
.pill.on { background: var(--sea); color: #fff; }
.wide { display: block; width: 100%; text-align: left; padding: 12px 14px; border-radius: 14px; background: rgba(233, 211, 166, .35); font-weight: 700; margin-top: 6px; font-size: 15px; }
.wide.danger { background: rgba(240, 122, 85, .15); color: #b4472b; }
.panel p, .panel li { font-size: 14px; line-height: 1.45; }
.panel ul { padding-left: 18px; margin: 6px 0; }
.check { display: grid; grid-template-columns: 26px 1fr; gap: 6px; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,.06); font-size: 14px; }
.check .mark { font-size: 18px; line-height: 1; }
.check .d { color: var(--ink-soft); font-size: 12.5px; }
.ok { color: #1f9a62; } .bad { color: #c2412a; } .wait { color: var(--ink-soft); }
#fps { position: fixed; left: 10px; bottom: calc(92px + var(--safe-b)); font: 11px/1.3 ui-monospace, monospace; color: rgba(0,0,0,.55); background: rgba(255,255,255,.6); padding: 3px 6px; border-radius: 6px; pointer-events: none; display: none; }
@media (max-width: 380px) { .tool { width: 60px; } .tool.size { width: 50px; } }
@media (orientation: landscape) and (max-height: 500px) { #toolbar { left: auto; right: 10px; transform: none; } #hint { bottom: calc(14px + var(--safe-b)); left: 12px; transform: none; max-width: 46vw; } }
</style>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>
<!--SCRIPT-->
</body>
</html>
