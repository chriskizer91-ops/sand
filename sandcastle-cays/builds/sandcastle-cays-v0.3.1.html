<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7fd6e6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sandcastle Cays</title>
<style>
:root {
  --ink: #3b3a36;
  --ink-soft: #6f6a5e;
  --paper: rgba(255, 252, 245, 0.92);
  --paper-solid: #fffcf5;
  --sand: #e9d3a6;
  --sand-deep: #c9a66b;
  --sea: #2fb5b0;
  --sea-deep: #157e93;
  --coral: #f07a55;
  --shadow: 0 6px 18px rgba(40, 60, 70, 0.18);
  --radius: 18px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe8f5; color: var(--ink);
  font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--sea); outline-offset: 2px; }

/* ---------- heads-up display ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
#topbar { position: absolute; top: calc(10px + var(--safe-t)); left: 10px; right: 10px; display: flex; gap: 8px; align-items: flex-start; pointer-events: none; }
#topbar > * { pointer-events: auto; }
.spacer { flex: 1; pointer-events: none !important; }
.round { width: 48px; height: 48px; border-radius: 50%; background: var(--paper); box-shadow: var(--shadow); display: grid; place-items: center; transition: transform .12s ease, opacity .2s; }
.round:active { transform: scale(0.92); }
.round[disabled] { opacity: .45; }
#hand { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; border-radius: 26px; background: var(--paper); box-shadow: var(--shadow); min-height: 48px; max-width: 58vw; }
#hand .meter { width: 70px; height: 12px; border-radius: 6px; background: rgba(120, 100, 70, .18); overflow: hidden; flex: none; }
#hand .fill { height: 100%; width: 0%; border-radius: 6px; background: var(--sand); transition: width .15s, background .3s; }
#hand .label { font-size: 13px; line-height: 1.15; color: var(--ink-soft); }
#hand .label b { color: var(--ink); font-weight: 700; }
#toolbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(12px + var(--safe-b)); display: flex; gap: 8px; padding: 8px; border-radius: 28px; background: var(--paper); box-shadow: var(--shadow); }
.tool { width: 70px; height: 64px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 12px; font-weight: 700; color: var(--ink-soft); transition: background .15s, color .15s, transform .1s; }
.tool:active { transform: scale(0.94); }
.tool.on { background: var(--sea); color: #fff; box-shadow: inset 0 -3px 0 rgba(0,0,0,.12); }
.tool.size { width: 56px; border-left: 1px solid rgba(0,0,0,.06); border-radius: 0 20px 20px 0; }
#toast { position: absolute; left: 50%; top: calc(72px + var(--safe-t)); transform: translateX(-50%) translateY(-8px); background: rgba(40, 52, 58, .86); color: #fff; padding: 9px 16px; border-radius: 22px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; max-width: 86vw; text-align: center; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#hint { position: absolute; left: 50%; bottom: calc(100px + var(--safe-b)); transform: translateX(-50%); background: var(--paper); box-shadow: var(--shadow); border-radius: 16px; padding: 10px 14px; font-size: 14px; line-height: 1.35; max-width: min(92vw, 440px); text-align: center; transition: opacity .4s; }
#hint.hide { opacity: 0; pointer-events: none; }

/* ---------- screens and panels ---------- */
.screen { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; z-index: 20; }
.sure { background: rgba(20, 40, 50, .35); z-index: 40; }
#start { background: linear-gradient(180deg, rgba(120, 205, 235, .55), rgba(255, 238, 205, .75)); transition: opacity .5s; }
#start.gone { opacity: 0; pointer-events: none; }
.card { background: var(--paper-solid); border-radius: 26px; box-shadow: 0 14px 40px rgba(30, 60, 80, .25); padding: 26px 24px 22px; max-width: 420px; width: 100%; text-align: center; }
.card h1 { margin: 0 0 2px; font-size: 32px; letter-spacing: .5px; color: var(--sea-deep); }
.card .sub { margin: 0 0 16px; color: var(--ink-soft); font-size: 15px; }
.card p { font-size: 15px; line-height: 1.45; margin: 8px 0; }
.big { display: inline-block; margin-top: 14px; padding: 14px 34px; border-radius: 30px; background: var(--sea); color: #fff; font-size: 18px; font-weight: 800; box-shadow: 0 6px 0 var(--sea-deep), var(--shadow); transition: transform .1s; }
.big:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--sea-deep); }
.big[disabled] { opacity: .6; }
.progress { height: 10px; border-radius: 6px; background: rgba(0,0,0,.08); overflow: hidden; margin-top: 16px; }
.progress div { height: 100%; width: 0%; background: var(--sand-deep); transition: width .2s; }
.small { font-size: 12px; color: var(--ink-soft); margin-top: 12px; }
.panel { position: fixed; z-index: 30; right: 10px; top: calc(66px + var(--safe-t)); width: min(360px, calc(100vw - 20px)); max-height: calc(100% - 90px - var(--safe-t) - var(--safe-b)); overflow: auto; background: var(--paper-solid); border-radius: 22px; box-shadow: 0 12px 34px rgba(30, 60, 80, .28); padding: 16px; transform-origin: top right; transition: transform .18s, opacity .18s; }
.panel.hidden { opacity: 0; transform: scale(.94); pointer-events: none; }
.panel h2 { margin: 2px 0 10px; font-size: 19px; color: var(--sea-deep); display: flex; align-items: center; justify-content: space-between; }
.panel h3 { margin: 14px 0 6px; font-size: 14px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .6px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { padding: 9px 13px; border-radius: 16px; background: rgba(47, 181, 176, .12); font-weight: 700; font-size: 14px; color: var(--sea-deep); }
.pill.on { background: var(--sea); color: #fff; }
.wide { display: block; width: 100%; text-align: left; padding: 12px 14px; border-radius: 14px; background: rgba(233, 211, 166, .35); font-weight: 700; margin-top: 6px; font-size: 15px; }
.wide.danger { background: rgba(240, 122, 85, .15); color: #b4472b; }
.panel p, .panel li { font-size: 14px; line-height: 1.45; }
.panel ul { padding-left: 18px; margin: 6px 0; }
.check { display: grid; grid-template-columns: 26px 1fr; gap: 6px; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,.06); font-size: 14px; }
.check .mark { font-size: 18px; line-height: 1; }
.check .d { color: var(--ink-soft); font-size: 12.5px; }
.ok { color: #1f9a62; } .bad { color: #c2412a; } .wait { color: var(--ink-soft); }
#fps { position: fixed; left: 10px; bottom: calc(92px + var(--safe-b)); font: 11px/1.3 ui-monospace, monospace; color: rgba(0,0,0,.55); background: rgba(255,255,255,.6); padding: 3px 6px; border-radius: 6px; pointer-events: none; display: none; }

/* ---------- first person ---------- */
#fphud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
body[data-mode="build"] #fphud > :not(#findcard), body[data-mode="none"] #fphud { display: none; }
body[data-mode="fp"] #toolbar, body[data-mode="fp"] #hand, body[data-mode="fp"] #hint, body[data-mode="fp"] [data-build],
body[data-mode="none"] #toolbar, body[data-mode="none"] #hand { display: none !important; }
body[data-mode="build"] [data-fp] { display: none !important; }
#dot { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 0 0 1.5px rgba(0,0,0,.25); transition: transform .15s, background .15s; }
#dot.live { transform: scale(1.8); background: #fff; }
#prompt { position: absolute; left: 50%; top: calc(50% + 34px); transform: translateX(-50%); background: rgba(30, 42, 48, .62); color: #fff; padding: 7px 14px; border-radius: 18px; font-size: 15px; font-weight: 700; white-space: nowrap; transition: opacity .15s; }
#prompt.hide { opacity: 0; }
#prompt kbd { display: inline-block; min-width: 22px; padding: 1px 6px; margin-right: 6px; border-radius: 6px; background: rgba(255,255,255,.9); color: var(--ink); font: 800 13px/1.4 inherit; text-align: center; }
#clock { position: absolute; top: calc(12px + var(--safe-t)); left: 50%; transform: translateX(-50%); background: var(--paper); box-shadow: var(--shadow); border-radius: 20px; padding: 7px 14px; font-size: 14px; font-weight: 700; color: var(--ink-soft); white-space: nowrap; }
#basket { position: absolute; top: calc(10px + var(--safe-t)); left: 10px; display: flex; align-items: center; gap: 6px; background: var(--paper); box-shadow: var(--shadow); border-radius: 26px; padding: 6px 14px 6px 10px; min-height: 48px; font-size: 14px; color: var(--ink-soft); }
#basket b { color: var(--ink); font-size: 16px; }
#basket.full { background: #ffe9c7; }
#stick { position: absolute; left: 0; top: 0; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.16); border: 2px solid rgba(255,255,255,.45); }
#stick.hide { display: none; }
#stick .knob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.7); box-shadow: var(--shadow); }
#actionbtn, #jumpbtn { position: absolute; pointer-events: auto; border-radius: 50%; background: var(--paper); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--sea-deep); }
#actionbtn { right: calc(22px + env(safe-area-inset-right, 0px)); bottom: calc(110px + var(--safe-b)); width: 84px; height: 84px; background: var(--sea); color: #fff; font-size: 12px; font-weight: 800; align-content: center; gap: 0; }
#actionbtn.hide { display: none; }
#actionbtn span { display: block; margin-top: -2px; }
#jumpbtn { right: calc(26px + env(safe-area-inset-right, 0px)); bottom: calc(22px + var(--safe-b)); width: 62px; height: 62px; }
#lookhint { position: absolute; left: 50%; bottom: calc(26px + var(--safe-b)); transform: translateX(-50%); background: rgba(30,42,48,.62); color: #fff; border-radius: 16px; padding: 8px 14px; font-size: 14px; white-space: nowrap; }
#lookhint.hide { display: none; }
#findcard { position: absolute; left: 50%; top: calc(64px + var(--safe-t)); transform: translateX(-50%) translateY(-10px); background: var(--paper-solid); box-shadow: 0 10px 30px rgba(30,60,80,.25); border-radius: 18px; padding: 12px 16px; max-width: min(92vw, 420px); opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; text-align: center; }
#findcard.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#findcard b { display: block; color: var(--sea-deep); font-size: 16px; margin-bottom: 3px; }
#findcard span { font-size: 14px; line-height: 1.4; }
#standbtn { position: fixed; z-index: 6; left: 10px; top: calc(66px + var(--safe-t)); display: flex; align-items: center; gap: 6px; padding: 8px 14px 8px 10px; border-radius: 24px; background: var(--paper); box-shadow: var(--shadow); font-weight: 800; color: var(--sea-deep); }
#standbtn.hide { display: none; }
#logbook { width: min(420px, calc(100vw - 20px)); }
.logrow { padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,.06); }
.logrow .name { font-weight: 800; font-size: 15px; display: flex; justify-content: space-between; gap: 8px; }
.logrow .name span { font-weight: 600; font-size: 12.5px; color: var(--ink-soft); text-align: right; }
.logrow .fact { font-size: 13.5px; line-height: 1.45; color: var(--ink); margin-top: 2px; }
.logrow.unknown .name { color: var(--ink-soft); font-weight: 700; }

/* ---------- sailing ---------- */
#sailhud { position: fixed; z-index: 5; top: calc(56px + var(--safe-t)); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; background: var(--paper); box-shadow: var(--shadow); border-radius: 40px; padding: 5px 16px 5px 6px; pointer-events: none; max-width: 94vw; }
#sailhud.hide, body[data-mode="build"] #sailhud, body[data-mode="none"] #sailhud { display: none; }
#sailhud .txt { font-size: 13px; line-height: 1.3; color: var(--ink-soft); white-space: nowrap; }
#sailhud .l1 { font-size: 14.5px; color: var(--ink); }
#sailhud .bad { color: #c2412a; }
#helmbar { position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); bottom: calc(12px + var(--safe-b)); display: flex; gap: 4px; padding: 6px; border-radius: 26px; background: var(--paper); box-shadow: var(--shadow); }
#helmbar.hide, body[data-mode="build"] #helmbar { display: none; }
#helmbar .tool { width: 66px; height: 62px; position: relative; }
#helmbar kbd { position: absolute; top: 3px; right: 6px; font: 700 10px/1 ui-monospace, monospace; color: var(--ink-soft); opacity: .7; }
body.athelm #jumpbtn { display: none; }
/* Cards drop below the sailing dial so they never cover it. */
body.sailing #findcard { top: calc(130px + var(--safe-t)); }
body.athelm #actionbtn { bottom: calc(96px + var(--safe-b)); }
#chart { width: min(380px, calc(100vw - 20px)); }
#chart .chartmap { display: block; margin: 4px auto 6px; border-radius: 14px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
@media (max-width: 640px) { #sailhud { top: calc(104px + var(--safe-t)); } body.sailing #findcard { top: calc(178px + var(--safe-t)); } #helmbar .tool { width: 58px; font-size: 11px; } }
@media (max-width: 640px) { #clock { left: 10px; top: calc(66px + var(--safe-t)); transform: none; font-size: 12.5px; padding: 6px 12px; } #findcard { top: calc(108px + var(--safe-t)); } #prompt { font-size: 14px; } }
@media (max-width: 380px) { .tool { width: 60px; } .tool.size { width: 50px; } }
@media (orientation: landscape) and (max-height: 500px) { #toolbar { left: auto; right: 10px; transform: none; } #hint { bottom: calc(14px + var(--safe-b)); left: 12px; transform: none; max-width: 46vw; } }
</style>

      <h2>How to play</h2>
      <h3>Getting about</h3>
      <ul>
        <li><b>Phone</b>: put your left thumb down anywhere on the left and slide it to walk (push it all the way to run). Drag with your right thumb to look. Tap a find to pick it up. The round button does what the label says; the arrow jumps.</li>
        <li><b>Laptop</b>: click once so the mouse turns your head (Esc lets go). W A S D or arrows to walk, Shift to run, Space to jump, E (or click) to pick up and use, L for the logbook.</li>
        <li><b>Leaving the boat</b>: walk to the swim ladder at the stern (the back of the boat). Climb back up the same ladder. You can also jump over the side.</li>
      </ul>
      <h3>Sailing</h3>
      <ul>
        <li><b>Take the helm</b> in the cockpit (E, or the round button). Steer with A and D (phone: your left thumb). W and S raise and lower the sails (phone: \u201CMore sail\u201D and \u201CLess sail\u201D). X drops or raises the anchor. E lets go.</li>
        <li><b>The little outboard</b>: R for more motor, F for less (and on into reverse). Use it to get out of irons, through the gap in the reef, up to an anchorage, or backwards off a sandbank. It goes off when you let go of the tiller.</li>
        <li>You can\u2019t sail straight into the wind. If the sails flap and you slow down (\u201Cin irons\u201D), turn away from the wind. To go upwind, zig-zag. The little dial shows where the wind comes from; the red wedge is where you can\u2019t sail.</li>
        <li>You\u2019re fastest with the wind from the side. The reef around Home Cay has one gap, to the south-west: hitting the reef scrapes the hull.</li>
        <li><b>The chart</b> (M, or the map button) shows where you are. Tap a place and she sails there by herself and anchors.</li>
      </ul>
      <h3>Beachcombing</h3>
      <ul>
        <li>Every morning the sea leaves new things along the high-tide line: shells, sea glass, driftwood, rope, sea beans and more.</li>
        <li>Your basket holds ${Ws}. Empty it into the locker in the boat\u2019s cockpit. The logbook keeps every kind you\u2019ve found.</li>
      </ul>
      <h3>Building (kneel on the cove\u2019s sand)</h3>
      <ul>
        <li><b>Dig</b>: drag on the sand to scoop it into your hands. Dig near the water, or dig down a little, for damp sand.</li>
        <li><b>Pile</b>: drag to pour what you're holding. Damp sand holds its shape, dry sand slides into soft cones.</li>
        <li><b>Pat</b>: tap to pack sand firm (packed damp sand stands tall and holds tunnels). Rub to smooth.</li>
        <li><b>Size</b>: small, medium or large hands.</li>
      </ul>
      <h3>Phone, while building</h3>
      <ul>
        <li>One finger: use the tool</li>
        <li>Two fingers: drag to swing around, pinch to zoom</li>
        <li>Quick two-finger tap: glide over to that spot</li>
      </ul>
      <h3>Laptop, while building</h3>
      <ul>
        <li>Click and drag: use the tool</li>
        <li>Two-finger swipe (or right-drag): swing around</li>
        <li>Pinch or mouse wheel: zoom \xB7 Right-click: glide there</li>
        <li>Keys: W A S D to move, Q E to turn, 1 2 3 tools, [ ] size, Ctrl+Z undo, Esc or B to stand up</li>
      </ul>
      <h3>Sand tips</h3>
      <ul>
        <li>The sun dries the outside of your castle. Dried edges crumble unless they were patted firm.</li>
